<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="google" content="notranslate">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ميزانك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:#E6E9EA;--card:#FFFFFF;--soft:#F1F3F4;--line:#D3D9DC;--text:#12202A;--mute:#5D6D75;
--pri:#1D6B57;--on-pri:#FFFFFF;--hi:#F2B705;--ok:#1B7F52;--bad:#C03A2B;
--in-bg:#DDF0E8;--in-fg:#14664A;--out-bg:#FBE9D2;--out-fg:#9A5A06;--open-bg:#FFF1BF;--open-fg:#7A5B00;
--led-bg:#0F1917;--led:#FFC247;--r:8px}
@media(prefers-color-scheme:dark){:root{--bg:#0E1517;--card:#162023;--soft:#1C2A2E;--line:#28383D;--text:#E4ECEE;--mute:#8CA0A6;
--pri:#3FB08F;--on-pri:#06231B;--ok:#3FC38A;--bad:#F0786A;--in-bg:#12352A;--in-fg:#6FD8AE;--out-bg:#3A2A10;--out-fg:#F2B866;--open-bg:#3B3208;--open-fg:#F2D45C;--led-bg:#070E0D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55;padding-bottom:84px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
header{position:sticky;top:0;z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
header>div.in{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--pri)}
.brand svg{width:30px;height:30px}
.brand h1{margin:0;font-size:19px;font-weight:700;color:var(--text);letter-spacing:0}
.hr{display:flex;align-items:center;gap:8px}
.badge{font-size:12px;padding:3px 10px;border-radius:4px;background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.ib{background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;line-height:0}
.ib svg{width:18px;height:18px}
main{padding:14px 16px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin:12px 0 6px}
input,select,textarea{width:100%;min-height:46px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px 12px;font-size:16px;font-family:inherit}
textarea{min-height:0}
input:disabled{opacity:.6;background:var(--soft)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px;border-color:transparent}
input[type=checkbox]{min-height:0;width:18px!important;height:18px;accent-color:var(--pri)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:6px;font-size:15px;padding:12px;font-weight:600;transition:background .15s,transform .05s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.btn{width:100%;min-height:48px;background:var(--pri);color:var(--on-pri);margin-top:12px;font-size:16px}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn2{background:var(--soft);color:var(--text);border:1px solid var(--line);font-size:14px;padding:9px 14px;display:inline-block;text-align:center}
.btn2.bad{color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--card);color:var(--mute);border:1px solid var(--line);font-size:14px;padding:11px 6px}
.seg button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
nav{position:fixed;bottom:0;inset-inline:0;display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{background:none;color:var(--mute);border-radius:0;padding:8px 2px 7px;font-size:11px;font-weight:500;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--hi);font-weight:700}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;padding:13px 14px}
.rec:hover{background:var(--soft)}
.rec.k-in{border-inline-start:4px solid var(--in-fg)}
.rec.k-out{border-inline-start:4px solid var(--out-fg)}
.rec h3{margin:0 0 3px;font-size:16px;font-weight:600}
.rec p{margin:1px 0;color:var(--mute);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-inline-start:6px;vertical-align:middle}
.tag.in{background:var(--in-bg);color:var(--in-fg)}.tag.out{background:var(--out-bg);color:var(--out-fg)}.tag.open{background:var(--open-bg);color:var(--open-fg)}
.kg{font-size:19px;font-weight:700;white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
.kg small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.stat{padding:13px 14px;box-shadow:0 0 0 .5px var(--line)}
.stat b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--mute)}
.sec{margin:20px 0 10px;font-size:14px;font-weight:600;color:var(--mute);border-inline-start:3px solid var(--hi);padding-inline-start:9px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px;background:var(--soft);white-space:nowrap}
tr.tot td{font-weight:700;background:var(--soft);border-top:2px solid var(--line)}
tr[onclick]{cursor:pointer}tr[onclick]:hover td{background:var(--soft)}
.mute{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:28px 0;font-size:14px}
.banner{background:var(--open-bg);color:var(--open-fg);border:1px solid var(--hi);border-radius:var(--r);padding:11px 13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#res{background:var(--led-bg);border-color:#000;padding:10px 14px}
.resgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.resgrid div{padding:8px 6px}
.resgrid span{display:block;font-size:11px;color:#8FA9A2}
.resgrid b{font-size:18px;font-weight:600;color:var(--led);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,194,71,.3)}
.resgrid .big{grid-column:span 3;border-top:1px solid #22332F;padding:10px 6px}
.resgrid .big b{font-size:34px;font-weight:700;line-height:1.2}
.thumbs,.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative}
.th img,.photos img{width:92px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--soft)}
.th button{position:absolute;top:-6px;inset-inline-start:-6px;width:22px;height:22px;padding:0;border-radius:50%;background:var(--bad);color:#fff;font-size:12px}
.photos figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(8,16,18,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px;border:1px solid var(--line)}
.sheet h2{margin:0 0 12px;font-size:18px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .btn{margin-top:0;flex:1 1 100%}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:80}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:92vh}
.prevbox{margin-top:10px;background:#000;border-radius:var(--r);overflow:hidden;min-height:160px}
.prevbox video,.prevbox img{width:100%;display:block;max-height:50vh;object-fit:contain}
.filebtn{margin-top:10px;width:100%;cursor:pointer}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{width:100%;max-width:400px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 22px}
.authbox .logo{color:var(--pri);display:flex;justify-content:center}.authbox .logo svg{width:54px;height:54px}
.authbox h1{margin:6px 0 4px;font-size:24px}
.authbox label{text-align:right}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
#toast{position:fixed;top:14px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--pri);color:var(--on-pri);padding:10px 18px;border-radius:6px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}#toast.bad{background:var(--bad);color:#fff}
.urow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border:0}
#ticket{display:none}
@media(min-width:900px){
  body{padding:0 92px 0 0}
  nav{inset:0 0 0 auto;width:92px;grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-left:1px solid var(--line);padding:12px 0;gap:2px}
  nav button{padding:12px 2px;font-size:12px}
  nav button.on{box-shadow:inset -3px 0 0 var(--hi)}
  main{max-width:980px;padding:20px 24px}
  #modal{align-items:center}.sheet{border-radius:12px;max-width:720px}
  #lb{padding-right:92px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{padding:0;background:#fff}
  body>*:not(#ticket){display:none!important}
  #ticket{display:block!important;color:#000;background:#fff;font-family:Tahoma,Arial,sans-serif;margin:0 auto}
  #ticket.p80{width:72mm;font-size:13px;padding:2mm 0}
  #ticket.p58{width:48mm;font-size:11px;padding:2mm 0}
  #ticket.pA4{width:100%;font-size:13px}
  #ticket .copy{page-break-after:always}
  #ticket .copy:last-child{page-break-after:auto}
  #ticket h2{text-align:center;margin:0 0 6px;font-size:1.25em}
  #ticket h3{margin:14px 0 6px;font-size:1.05em}
  #ticket table{width:100%;border-collapse:collapse}
  #ticket td,#ticket th{border-bottom:1px dashed #777;padding:3px 2px;color:#000;vertical-align:top;text-align:right}
  #ticket th{border-bottom:2px solid #000;font-weight:700}
  #ticket.p80 td:last-child,#ticket.p58 td:last-child{text-align:left;font-weight:700}
  #ticket tr.tot td{border-top:2px solid #000;font-size:1.1em}
  #ticket .ctr{text-align:center}
  #ticket .blank{display:inline-block;min-width:20mm;border-bottom:1px solid #000;height:1.3em}
  #ticket img{width:34mm;height:25mm;object-fit:cover;margin:2px}
  #ticket.p58 img{width:22mm;height:16mm}
  #ticket .stl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
  #ticket .stl div{border:1px solid #000;padding:6px;text-align:center}
}
</style>
<style id="pg"></style>
</head>

<script>
'use strict';
/* ====== إعداد القاعدة الأونلاين (اختياري): ضع بيانات Supabase هنا أو من شاشة الإعداد ====== */
const CLOUD={url:'',key:''};

/* ====== أدوات ====== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmt=(n,d=0)=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:d});
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dt=d=>d?new Date(d).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'—';
const ROLES={admin:'مدير',operator:'ميزان',viewer:'مشاهدة'};
const toast=(m,bad)=>{const t=$('toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)};
const ticketNo=r=>r.loc_seq!=null?(locCode(r.location_id)?locCode(r.location_id)+'-':'')+String(r.loc_seq).padStart(6,'0'):r.seq!=null?String(r.seq).padStart(6,'0'):dayKey(r.created_at).replace(/-/g,'').slice(2)+'-'+String(r.id).replace(/-/g,'').slice(0,4).toUpperCase();
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('تعذّر تحميل المكتبة (تأكد من الإنترنت)'));document.head.appendChild(s)})}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mz:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'mz:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}}
function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click()}

/* ====== الحالة ====== */
const DEF_SET={id:'main',company:'ميزانك',empty_unit_kg:0,grades:[{name:'أ - نظيفة جدًا',pct:0},{name:'ب - جيدة',pct:2},{name:'ج - متوسطة',pct:5},{name:'د - غير نظيفة',pct:10}]};
const S={user:null,mode:'local',view:'home',w:[],parties:[],materials:[],users:[],pay:[],exp:[],cus:[],locks:[],audit:[],tf:{period:'today',from:dayKey(new Date()),to:dayKey(new Date())},set:{...DEF_SET},draft:null,editId:null,rec:null,
  f:{q:'',from:'',kind:'',status:''},rf:{from:dayKey(new Date()),to:dayKey(new Date()),period:'today',party:'',material:'',kind:''},tab:'parties',stream:null,sd:null};
let DB=null,busy=false;
const can={weigh:()=>S.user&&['admin','operator'].includes(S.user.role),admin:()=>S.user&&S.user.role==='admin'};

/* ====== طبقة البيانات: محلي (IndexedDB) ====== */
const TABLES=['parties','materials','weighings','settings','users','payments','expenses','audit_log','day_locks','custody'];
const Local={
  db:null,
  async init(){this.db=await new Promise((res,rej)=>{const r=indexedDB.open('mizanik',4);r.onupgradeneeded=()=>{TABLES.forEach(t=>{if(!r.result.objectStoreNames.contains(t))r.result.createObjectStore(t,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  tx(t,mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(t,mode);const rq=fn(tx.objectStore(t));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})},
  async all(t){const a=await this.tx(t,'readonly',s=>s.getAll());return a.sort((x,y)=>String(y.created_at||'').localeCompare(String(x.created_at||'')))},
  async put(t,r){if((t==='weighings'||t==='payments'||t==='custody')&&r.seq==null){const k='mz_seq_'+t;r.seq=(+localStorage.getItem(k)||0)+1;localStorage.setItem(k,r.seq)}await this.tx(t,'readwrite',s=>s.put(r));return r},
  del(t,id){return this.tx(t,'readwrite',s=>s.delete(id))},
  async photo(d){return d},
  async src(ref){return ref}
};
/* ====== طبقة البيانات: أونلاين (Supabase) ====== */
const sig={};
/* عميل Supabase خفيف (REST مباشر) — لا يحتاج تحميل أي مكتبة خارجية */
class MiniQB{
  constructor(c,t){this.c=c;this.t=t;this.p=new URLSearchParams();this.m='GET';this.body=null;this.pref=[]}
  select(cols){this.p.set('select',cols||'*');if(this.m!=='GET')this.pref.push('return=representation');return this}
  order(col,o){this.p.set('order',col+'.'+(o&&o.ascending===false?'desc':'asc'));return this}
  limit(n){this.p.set('limit',n);return this}
  eq(col,v){this.p.append(col,'eq.'+v);return this}
  upsert(r){this.m='POST';this.body=r;this.pref.push('resolution=merge-duplicates');return this}
  delete(){this.m='DELETE';return this}
  then(res,rej){return this.run().then(res,rej)}
  async run(){
    const qs=this.p.toString(),h={'Content-Type':'application/json'};if(this.pref.length)h.Prefer=this.pref.join(',');
    return this.c._json('/rest/v1/'+this.t+(qs?'?'+qs:''),{method:this.m,headers:h,body:this.body!=null?JSON.stringify(this.body):undefined},true);
  }
}
class MiniSB{
  constructor(url,key){
    this.url=url.replace(/\/+$/,'');this.key=key;this.sk='mz_sb_session';
    this.auth={
      signUp:async o=>{const r=await this._json('/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:o.email,password:o.password,data:(o.options&&o.options.data)||{}})},false);
        if(r.error)return r;const j=r.data||{};if(j.access_token){this._save(this._norm(j));return{data:{user:j.user,session:this._sess()},error:null}}return{data:{user:j.user||j,session:null},error:null}},

function compute(d){
  const g=d.gross===''?null:num(d.gross),t=d.tare===''?null:num(d.tare),has=g!==null&&t!==null;
  const net=has?Math.max(0,g-t):0,emp=num(d.empties_count)*num(d.empties_unit);
  const gr=d.grade_idx===''?null:S.set.grades[+d.grade_idx],pct=gr?num(gr.pct):0;
  const gd=Math.max(0,net-emp)*pct/100,payable=Math.max(0,net-emp-gd),price=num(d.price);
  return{has,net,emp,pct,gd,payable,price,total:d.price_unit==='ardeb'?payable/ARDEB*price:payable/1000*price};
}

function weighWarnings(d,c){
  const w=[],plate=d.plate.trim(),cur=S.rec&&S.rec.id,prior=S.w.filter(r=>r.plate===plate&&r.status==='done'&&r.id!==cur);
  if(c.has&&prior.some(r=>Date.now()-new Date(r.created_at)<30*60000))w.push('الشاحنة دي اتوزنت من أقل من 30 دقيقة');
  if(d.kind==='out'&&c.has&&d.material_id){const bal=stockBal(d.material_id,dLoc(),cur);if(c.payable>bal+0.001)w.push('الكمية المصروفة ('+fmt(c.payable,1)+' كجم) أكبر من رصيد المخزون المتاح ('+fmt(bal,1)+' كجم)')}
  const lt=prior.find(r=>r.tare!=null);
  if(d.tare!==''&&lt&&lt.tare>0){const df=Math.abs(num(d.tare)-lt.tare)/lt.tare*100;if(df>10)w.push('الوزن الفارغ مختلف '+fmt(df,0)+'% عن آخر مرة ('+fmt(lt.tare)+' كجم)')}
  return w;
}
async function saveWeigh(pp){
  if(busy)return;const d=S.draft;
  if(!d.plate.trim())return toast('⚠️ اكتب رقم الشاحنة',1);
  if(d.gross===''&&d.tare==='')return toast('⚠️ أدخل وزنة واحدة على الأقل',1);
  if(locsOn()&&!d.loc)return toast('⚠️ اختر الموقع',1);
  {const o0=S.rec;if(o0&&o0.locked)return toast('⚠️ الفاتورة معتمدة ومقفولة',1);const ld=(o0&&o0.status==='done')?dayKey(o0.created_at):dayKey(new Date());if(isLocked(ld,(o0&&o0.status==='done')?(o0.location_id||''):(d.loc||'')))return toast('⚠️ '+LOCKMSG,1)}
  const c=compute(d);
  if(c.has&&num(d.gross)<=num(d.tare)&&!confirm('الوزن القائم أقل من أو يساوي الفارغ. متأكد؟'))return;
  {const w=weighWarnings(d,c);if(w.length&&!confirm('⚠️ تنبيهات قبل الحفظ:\n- '+w.join('\n- ')+'\n\nمتابعة الحفظ؟'))return}
  busy=true;$('btn-save').disabled=true;{const b2=$('btn-savep');if(b2)b2.disabled=true}$('btn-save').textContent='جارٍ الحفظ...';
  try{
    const ac=await autoCaptureFor(d);
    const photos=[];for(const p of d.photos)photos.push({step:p.step,ref:String(p.ref).startsWith('data:')?await DB.photo(p.ref):p.ref});
    const now=new Date().toISOString(),old=S.rec;
    const party=S.parties.find(x=>x.id===d.party_id),mat=S.materials.find(x=>x.id===d.material_id),gr=d.grade_idx===''?null:S.set.grades[+d.grade_idx];
    const r={...(old||{id:uid(),created_at:now,created_by:S.user.id,created_by_name:S.user.name,paid:false,...locTag(d.loc),...(locsOn()&&d.loc?{loc_seq:nextLocSeq(d.loc)}:{})}),
      kind:d.kind,status:c.has?'done':'open',plate:d.plate.trim(),driver:d.driver.trim(),
      party_id:party?party.id:null,party_name:party?party.name:null,material_id:mat?mat.id:null,material_name:mat?mat.name:null,
      gross:d.gross===''?null:num(d.gross),tare:d.tare===''?null:num(d.tare),
      gross_at:d.gross!==''?((old&&old.gross_at)||now):null,tare_at:d.tare!==''?((old&&old.tare_at)||now):null,
      net:c.has?c.net:null,empties_count:num(d.empties_count),empties_unit_kg:num(d.empties_unit),empties_deduction:c.emp,
      grade_name:gr?gr.name:null,grade_pct:c.pct,grade_deduction:c.gd,payable:c.has?c.payable:null,
      price_per_ton:c.price,price_unit:d.price_unit,total:c.has?c.total:null,note:d.note.trim(),receiver:d.kind==='out'?(d.receiver||'').trim():'',photos};
    if(old&&old.status==='open'&&locsOn()&&(d.loc||'')!==(old.location_id||'')){Object.assign(r,locTag(d.loc));r.loc_seq=d.loc?nextLocSeq(d.loc):null}
    if(d.kind==='in'&&mat&&r.cust_price==null&&locCustOf(r.location_id)){const q=matPrices(mat);r.cust_price=+q.sp||0;r.cust_unit=q.su}
    const sv=await DB.put('weighings',r);if(sv&&sv.seq!=null)r.seq=sv.seq;
    audit(old?'update':'create','weighing',ticketNo(r),old?(old.status==='open'&&r.status==='done'?'إتمام الوزنة الثانية • صافي '+fmt(r.payable,1)+' كجم':'تعديل: '+(diffTxt(old,r)||'بدون تغيير جوهري')):r.plate+' • '+(r.kind==='in'?'وارد':'صادر'));
    const i=S.w.findIndex(x=>x.id===r.id);if(i>=0)S.w[i]=r;else S.w.unshift(r);
    S.draft=null;S.editId=null;S.rec=null;toast(ac.fail.length?'⚠️ تم الحفظ، لكن كاميرا لم تلتقط: '+ac.fail.join(' | '):(ac.ok?'✅ تم الحفظ والتقاط '+ac.ok+' صورة':'✅ تم الحفظ'),ac.fail.length?1:0);
    if(pp===true){go('home');await printAuto(r.id)}else if(r.status==='done'){go('home');openRec(r.id)}else go('home');
  }catch(e){toast('❌ '+(e.message||e),1);const b=$('btn-save');if(b){b.disabled=false;calc()}const b2=$('btn-savep');if(b2)b2.disabled=false}
  finally{busy=false}
}

function toDataUrl(src,w,h,label){
  const sc=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  const x=c.getContext('2d');x.drawImage(src,0,0,c.width,c.height);
  const fs=Math.max(14,Math.round(c.height*0.04)),bh=Math.round(fs*1.6);
  x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,c.height-bh,c.width,bh);
  x.fillStyle='#fff';x.font=fs+'px sans-serif';x.textBaseline='middle';x.direction='rtl';x.textAlign='right';x.fillText(label,c.width-10,c.height-bh/2);
  return c.toDataURL('image/jpeg',0.72);
}
const capLabel=(name,step)=>name+' • '+((S.draft&&S.draft.plate)||'')+' • '+(step==='gross'?'قائم':'فارغ')+' • '+new Date().toLocaleString('ar-EG');
const camErr=e=>{const n=e&&e.name;if(n==='NotAllowedError'||n==='SecurityError')return'المتصفح مش مدّي صلاحية الكاميرا (اسمح بها، ولازم الصفحة تتفتح من HTTPS)';if(n==='NotFoundError'||n==='OverconstrainedError')return'الكاميرا مش موجودة أو اتفصلت';if(n==='NotReadableError')return'الكاميرا مستخدمة في برنامج تاني';return(e&&e.message)||String(e)};
async function grabDevice(cam,step){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('المتصفح لا يدعم الكاميرا (لازم HTTPS)');
  let st;
  try{st=await navigator.mediaDevices.getUserMedia({video:cam.deviceId?{deviceId:{exact:cam.deviceId}}:true})}catch(e){throw new Error(camErr(e))}
  try{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=st;await v.play();
    for(let i=0;i<30&&(v.readyState<2||!v.videoWidth);i++)await new Promise(r=>setTimeout(r,100));
    await new Promise(r=>setTimeout(r,500));
    if(!v.videoWidth)throw new Error('الكاميرا لا تعطي صورة');
    return toDataUrl(v,v.videoWidth,v.videoHeight,capLabel(cam.name,step));
  }finally{st.getTracks().forEach(t=>t.stop())}
}
function grabIP(cam,step){return new Promise((res,rej)=>{
  if(location.protocol==='https:'&&/^http:/i.test(cam.url))return rej(new Error('المتصفح بيمنع كاميرا http من صفحة https. شغّل التطبيق من http أو استخدم رابط https للكاميرا'));
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{try{res(toDataUrl(im,im.naturalWidth,im.naturalHeight,capLabel(cam.name,step)))}catch(e){rej(new Error('الكاميرا لا تسمح بأخذ الصورة من المتصفح (CORS). فعّل Access-Control-Allow-Origin في الكاميرا أو استخدم كاميرا USB'))}};
  im.onerror=()=>{const pr=new Image();
    pr.onload=()=>rej(new Error('الكاميرا شغالة لكنها لا تسمح بأخذ الصورة من المتصفح (CORS). فعّل Access-Control-Allow-Origin في إعدادات الكاميرا أو استخدم كاميرا USB'));
    pr.onerror=()=>rej(new Error('تعذّر الاتصال بالكاميرا. تأكد إن الرابط بيفتح في المتصفح وإن الجهاز على نفس الشبكة'));
    pr.src=cam.url+(cam.url.includes('?')?'&':'?')+'_p='+Date.now()};
  im.src=cam.url+(cam.url.includes('?')?'&':'?')+'_='+Date.now();
})}
const grab=(cam,step)=>cam.type==='ip'?grabIP(cam,step):grabDevice(cam,step);
const autoOn=()=>localStorage.getItem('mz_autocam')!=='0';
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('انتهت المهلة، الكاميرا لم ترد')),ms))]);
async function autoCaptureFor(d){
  const res={ok:0,fail:[]},cams=camList().filter(c=>c.on);
  if(!autoOn()||!cams.length)return res;
  const steps=['gross','tare'].filter(st=>d[st]!==''&&!(S.rec&&S.rec[st]!=null)&&!d.photos.some(p=>p.step===st));
  if(!steps.length)return res;
  const b=$('btn-save');if(b)b.textContent='جارٍ التقاط صور الكاميرات...';
  for(const st of steps)await Promise.all(cams.map(async cam=>{try{d.photos.push({step:st,ref:await withTimeout(grab(cam,st),9000)});res.ok++}catch(e){res.fail.push(cam.name+' ('+(e.message||e)+')')}}));
  return res;
}

async function startPrev(){
  stopStream();const cam=camList().find(c=>c.id===$('cap-cam').value);if(!cam)return;
  const v=$('prev'),im=$('previmg');
  try{
    if(cam.type==='ip'){v.hidden=true;im.hidden=false;const set=()=>{im.src=cam.url+(cam.url.includes('?')?'&':'?')+'_='+Date.now()};set();if(/\.jpe?g|snapshot|snap/i.test(cam.url))S.ipTimer=setInterval(set,1500)}
    else{im.hidden=true;v.hidden=false;S.stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:cam.deviceId}}});v.srcObject=S.stream;S.streamCam=cam.id}
  }catch(e){toast('❌ تعذّر فتح الكاميرا',1)}
}
function capCount(){const n=S.draft.photos.length;if($('cap-n'))$('cap-n').textContent='عدد الصور الملتقطة: '+n}
async function capOne(){
  const cam=camList().find(c=>c.id===$('cap-cam').value);if(!cam)return;
  try{
    let u;
    if(cam.type==='device'&&S.stream&&S.streamCam===cam.id){const v=$('prev');u=toDataUrl(v,v.videoWidth,v.videoHeight,capLabel(cam.name,S.capStep))}
    else if(cam.type==='ip'){const im=$('previmg');try{u=toDataUrl(im,im.naturalWidth,im.naturalHeight,capLabel(cam.name,S.capStep))}catch(e){u=await grabIP(cam,S.capStep)}}
    else u=await grab(cam,S.capStep);
    addPhoto(S.capStep,u);capCount();toast('تم التقاط الصورة');
  }catch(e){toast('❌ '+(e.message||e),1)}

async function capAll(){
  stopStream();let n=0;
  for(const cam of camList().filter(c=>c.on)){try{addPhoto(S.capStep,await grab(cam,S.capStep));n++}catch(e){toast('❌ '+cam.name+': '+(e.message||e),1)}}
  capCount();if(n)toast('تم التقاط '+n+' صورة');startPrev();
}
function capFile(inp){

  if(!can.admin())return;const a=recRows().filter(r=>r.status==='done'&&!r.locked);
  if(!a.length)return toast('لا توجد فواتير مكتملة غير معتمدة في القائمة');

  const now=new Date().toISOString();
  try{for(const r of a){const n={...r,locked:true,locked_by:S.user.name,locked_at:now};await DB.put('weighings',n);Object.assign(r,n)}

const priceTxt=r=>r.price_per_ton?fmt(r.price_per_ton,2)+' ج.م / '+(r.price_unit==='ardeb'?'أردب':'طن'):'';

  const done=r.status==='done',k=(v,dg)=>v==null?'':fmt(v,dg||0)+' كجم';

async function scaleConnect(auto){
  if(!('serial' in navigator)){if(!auto)toast('المتصفح لا يدعم الاتصال بالميزان. استخدم Chrome أو Edge على كمبيوتر',1);return}
  if(SC.on)return;
  try{
    let port;if(auto){port=(await navigator.serial.getPorts())[0];if(!port)return}else port=await navigator.serial.requestPort();
    const c=scCfg();await port.open({baudRate:+c.baud||9600,dataBits:8,stopBits:1,parity:'none'});
    SC.port=port;SC.on=true;SC.val=null;SC.buf='';scSave({auto:true});scaleLoop();if(!auto)toast('✅ تم الاتصال بالميزان');if(S.view==='more')render()
  }catch(e){if(!auto)toast('❌ تعذر الاتصال بالميزان: '+(e.message||e),1)}
}
async function scaleLoop(){
  try{
    const dec=new TextDecoderStream();SC.port.readable.pipeTo(dec.writable).catch(()=>{});
    const rd=dec.readable.getReader();SC.reader=rd;
    for(;;){const {value,done}=await rd.read();if(done)break;scaleFeed(value)}
  }catch(e){}
  SC.on=false;SC.val=null;try{await SC.port.close()}catch(e){}
}
function scaleFeed(t){
  SC.buf+=t;const parts=SC.buf.split(/[\r\n]+/);SC.buf=parts.pop();if(SC.buf.length>200)SC.buf='';
  const u=scCfg().unit||'kg';
  for(const ln of parts){
    const m=ln.match(/-?\d+(?:[.,]\d+)?/g);if(!m)continue;let v=parseFloat(m[m.length-1].replace(',','.'));if(isNaN(v))continue;if(u==='ton')v*=1000;
    if(v!==SC.val){SC.val=v;SC.t0=Date.now()}
  }
}
async function scaleDisconnect(){
  scSave({auto:false});try{if(SC.reader)await SC.reader.cancel()}catch(e){}SC.on=false;SC.val=null;if(S.view==='more')render();toast('تم فصل الميزان')
}
const scStable=()=>SC.on&&SC.val!=null&&Date.now()-SC.t0>=1500;

  if(!SC.on||SC.val==null)return toast('⚠️ الميزان غير متصل أو لا توجد قراءة',1);

  const v=+SC.val.toFixed(2);if(locked(step))return toast('⚠️ الوزنة مسجلة ومقفولة',1);
  $('f-'+step).value=v;D(step,String(v));calc()
}

}
function cashEntries(){
  const e=[];
  S.pay.forEach(x=>{const p=S.parties.find(q=>q.id===x.party_id),out=!p||p.kind==='supplier';e.push({loc:x.location_id||'',grp:out?'supp':'cust',t:x.created_at,type:'pay',id:x.id,dir:out?'out':'in',amount:x.amount||0,method:x.method||'cash',label:(out?'دفعة إلى ':'تحصيل من ')+(x.party_name||(p&&p.name)||''),no:payNo(x),note:x.note||''})});
  S.exp.forEach(x=>e.push({loc:x.location_id||'',viaCus:!!x.custody_user,grp:x.kind==='income'?'inc':'exp',cat:x.category||'غير محدد',t:x.created_at,type:'exp',id:x.id,dir:x.kind==='income'?'in':'out',amount:x.amount||0,method:x.method||'cash',label:(x.kind==='income'?'إيراد: ':'مصروف: ')+(x.category||'')+(x.custody_user?' (من عهدة '+(x.custody_user_name||'')+')':''),no:'',note:x.note||''}));
  S.cus.forEach(x=>e.push({loc:x.location_id||'',grp:'cus',t:x.created_at,type:'cus',id:x.id,dir:x.kind==='return'?'in':'out',amount:x.amount||0,method:x.method||'cash',label:(x.kind==='return'?'رد عهدة من ':'عهدة إلى ')+(x.employee_name||''),no:payNo(x),note:x.note||''}));
  return e.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
}
function cashSummary(from,to,loc){
  if(loc===undefined)loc=effLoc();
  const all=cashEntries().filter(x=>!loc||x.loc===loc);let open=0,inn=0,out=0,nc=0;
  all.forEach(x=>{
    const d=dayKey(x.t),inR=(!from||d>=from)&&(!to||d<=to);
    if(x.viaCus)return;
    if(x.method!=='cash'){if(inR)nc+=x.amount;return}
    if(from&&d<from)open+=x.dir==='in'?x.amount:-x.amount;
    else if(inR){if(x.dir==='in')inn+=x.amount;else out+=x.amount}
  });
  return{open,inn,out,close:open+inn-out,nc,rows:all.filter(x=>(!from||dayKey(x.t)>=from)&&(!to||dayKey(x.t)<=to))};
}
const cashBalance=()=>cashSummary('','').close;
const kv=rows=>`<table>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;

const inR=(d,f)=>(!f.from||dayKey(d)>=f.from)&&(!f.to||dayKey(d)<=f.to);
const sumA=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const cusBal=id=>S.cus.filter(x=>x.employee_id===id).reduce((s,x)=>s+(x.kind==='return'?-x.amount:x.amount),0)-S.exp.filter(x=>x.custody_user===id&&x.kind!=='income').reduce((s,x)=>s+(x.amount||0),0);
function cusRows(f){
  const ids=new Set([...S.cus.map(x=>x.employee_id),...S.exp.filter(x=>x.custody_user).map(x=>x.custody_user)]);
  return [...ids].map(id=>{
    const name=(S.cus.find(x=>x.employee_id===id)||{}).employee_name||(S.exp.find(x=>x.custody_user===id)||{}).custody_user_name||'',
      P=a=>a.filter(x=>inR(x.created_at,f));
    return{id,name,iss:sumA(P(S.cus.filter(x=>x.employee_id===id&&x.kind!=='return')),'amount'),ret:sumA(P(S.cus.filter(x=>x.employee_id===id&&x.kind==='return')),'amount'),sp:sumA(P(S.exp.filter(x=>x.custody_user===id&&x.kind!=='income')),'amount'),bal:cusBal(id)};
  }).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
}
function cusLedger(id){
  const r=[];
  S.cus.filter(x=>x.employee_id===id).forEach(x=>r.push({t:x.created_at,type:'c',x,amt:x.kind==='return'?-x.amount:x.amount}));
  S.exp.filter(x=>x.custody_user===id&&x.kind!=='income').forEach(x=>r.push({t:x.created_at,type:'e',x,amt:-x.amount}));
  r.sort((a,b)=>String(a.t).localeCompare(String(b.t)));let bal=0;r.forEach(x=>{bal+=x.amt;x.bal=bal});return r;
}
function cusLedgerTable(rows,print){
  const body=rows.map(x=>x.type==='c'
    ?`<tr${print?'':` onclick="openCus('${x.x.id}')"`}><td>${dt(x.t)}</td><td>${x.x.kind==='return'?'رد عهدة':'استلام عهدة'} <small class="mute">#${payNo(x.x)}</small>${x.x.note?'<br><small class="mute">'+esc(x.x.note)+'</small>':''}</td><td>${x.x.kind==='return'?'':fmt(x.x.amount,2)}</td><td>${x.x.kind==='return'?fmt(x.x.amount,2):''}</td><td><b>${fmt(x.bal,2)}</b></td></tr>`
    :`<tr${print?'':` onclick="openExp('${x.x.id}')"`}><td>${dt(x.t)}</td><td>مصروف: ${esc(x.x.category)}${x.x.note?'<br><small class="mute">'+esc(x.x.note)+'</small>':''}</td><td></td><td>${fmt(x.x.amount,2)}</td><td><b>${fmt(x.bal,2)}</b></td></tr>`).join('');
  return `<table style="min-width:460px"><tr><th>الوقت</th><th>البيان</th><th>مستلم</th><th>مصروف / مردود</th><th>الرصيد</th></tr>${body||'<tr><td colspan="5" class="empty">لا توجد حركات</td></tr>'}</table>`;
}
function cusSecTable(f,print){
  const rows=cusRows(f),T={iss:sumA(rows,'iss'),sp:sumA(rows,'sp'),ret:sumA(rows,'ret'),bal:sumA(rows,'bal')};
  return `<table style="min-width:460px"><tr><th>الموظف</th><th>عهدة مستلمة (الفترة)</th><th>مصروف من العهدة (الفترة)</th><th>مردود</th><th>رصيد العهدة الحالي</th></tr>${rows.map(x=>`<tr${print?'':` onclick="openCusEmp('${x.id}')"`}><td>${esc(x.name)}</td><td>${fmt(x.iss,2)}</td><td>${fmt(x.sp,2)}</td><td>${fmt(x.ret,2)}</td><td><b>${fmt(x.bal,2)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد عهد</td></tr>'}${rows.length>1?`<tr class="tot"><td>الإجمالي</td><td>${fmt(T.iss,2)}</td><td>${fmt(T.sp,2)}</td><td>${fmt(T.ret,2)}</td><td>${fmt(T.bal,2)}</td></tr>`:''}</table>`;
}

  const iss=sumA(S.cus.filter(x=>x.employee_id===id&&x.kind!=='return'),'amount'),sp=sumA(S.exp.filter(x=>x.custody_user===id&&x.kind!=='income'),'amount'),ret=sumA(S.cus.filter(x=>x.employee_id===id&&x.kind==='return'),'amount');

async function saveCus(){
  const amount=num($('cu-a').value),eid=$('cu-e').value,u=S.users.find(x=>x.id===eid),kind=$('cu-k').value;
  if(!u)return toast('⚠️ اختر الموظف',1);if(amount<=0)return toast('⚠️ اكتب المبلغ',1);
  if(isLocked(dayKey(new Date())))return toast('⚠️ '+LOCKMSG,1);
  if(kind==='return'&&amount>cusBal(eid)+0.005&&!confirm('المبلغ أكبر من رصيد العهدة ('+fmt(cusBal(eid),2)+'). متابعة؟'))return;
  const r={id:uid(),created_at:new Date().toISOString(),employee_id:eid,employee_name:u.name||'',kind,amount,method:$('cu-m').value,note:$('cu-n').value.trim(),created_by_name:S.user.name,...locTag()};
  try{const sv=await DB.put('custody',r);if(sv&&sv.seq!=null)r.seq=sv.seq;S.cus.unshift(r);audit('create','custody',payNo(r),(kind==='return'?'رد عهدة من ':'عهدة إلى ')+r.employee_name+' • '+fmt(amount,2)+' ج.م');openCus(r.id,true);render()}catch(e){toast('❌ '+(e.message||e),1)}
}

async function delCus(id){
  const x=S.cus.find(q=>q.id===id);if(!x||!can.admin())return;
  if(isLocked(dayKey(x.created_at),x.location_id||''))return toast('⚠️ '+LOCKMSG,1);
  if(!confirm('حذف هذه الحركة؟'))return;
  try{await DB.del('custody',id);audit('delete','custody',payNo(x),(x.employee_name||'')+' • '+fmt(x.amount,2)+' ج.م');S.cus=S.cus.filter(q=>q.id!==id);closeModal();render()}catch(e){toast('❌ '+(e.message||e),1)}
}

function setTP(k){const r=periodRange(k);S.tf={...S.tf,period:k,from:r.from,to:r.to};render()}
function setTT(k){S.tf.tab=k;render()}
function treasuryTable(rows,print){
  const body=[...rows].reverse().map(x=>`<tr${print?'':` onclick="${x.type==='pay'?`openPay('${x.id}')`:x.type==='cus'?`openCus('${x.id}')`:`openExp('${x.id}')`}"`}${x.method!=='cash'?' style="opacity:.75"':''}><td>${dt(x.t)}</td><td>${esc(x.label)}${x.no?' <small class="mute">#'+x.no+'</small>':''}${x.note?'<br><small class="mute">'+esc(x.note)+'</small>':''}</td><td>${x.dir==='in'?fmt(x.amount,2):''}</td><td>${x.dir==='out'?fmt(x.amount,2):''}</td><td>${METH[x.method]||'نقدي'}</td></tr>`).join('');
  const ti=sumA(rows.filter(x=>x.dir==='in'),'amount'),to=sumA(rows.filter(x=>x.dir==='out'),'amount');
  return `<table style="min-width:440px"><tr><th>الوقت</th><th>البيان</th><th>وارد</th><th>منصرف</th><th>الطريقة</th></tr>${body||'<tr><td colspan="5" class="empty">لا توجد حركات في هذه الفترة</td></tr>'}${rows.length>1?`<tr class="tot"><td colspan="2">الإجمالي</td><td>${fmt(ti,2)}</td><td>${fmt(to,2)}</td><td></td></tr>`:''}</table>`;

function methodTable(es){
  const m={};es.forEach(x=>{const k=x.method||'cash';m[k]=m[k]||{n:0,v:0};m[k].n++;m[k].v+=x.amount});
  return `<table><tr><th>طريقة الدفع</th><th>عدد الحركات</th><th>المبلغ (ج.م)</th></tr>${Object.entries(m).map(([k,v])=>`<tr><td>${METH[k]||k}</td><td>${fmt(v.n)}</td><td>${fmt(v.v,2)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا حركات</td></tr>'}${es.length>1?`<tr class="tot"><td>الإجمالي</td><td>${fmt(es.length)}</td><td>${fmt(sumA(es,'amount'),2)}</td></tr>`:''}</table>`;
}
function partySecRows(kind,f){
  return S.parties.filter(p=>p.kind===kind).map(p=>{
    const ws=partyEntries(p.id).filter(e=>inR(e.r.created_at,f)&&inLoc(e.r,effLoc())).map(e=>({total:e.amt})),ps=S.pay.filter(x=>x.party_id===p.id&&inR(x.created_at,f)&&inLoc(x,effLoc()));
    return{name:p.name,n:ws.length,inv:sumA(ws,'total'),paid:sumA(ps,'amount'),np:ps.length,due:partyStats(p.id).due};
  }).filter(x=>x.n||x.np||Math.abs(x.due)>0.005).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
}
function partySecTable(kind,f){
  const rows=partySecRows(kind,f),sup=kind==='supplier',T={n:sumA(rows,'n'),inv:sumA(rows,'inv'),paid:sumA(rows,'paid'),due:sumA(rows,'due')};
  return `<table style="min-width:460px"><tr><th>${sup?'المورد':'العميل'}</th><th>الفواتير</th><th>${sup?'مستحق له في الفترة':'مستحق عليه في الفترة'}</th><th>${sup?'المدفوع له':'المحصَّل منه'}</th><th>الرصيد المتبقي</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.n)}</td><td>${fmt(x.inv,2)}</td><td>${fmt(x.paid,2)}</td><td><b>${fmt(x.due,2)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد حركات</td></tr>'}${rows.length>1?`<tr class="tot"><td>الإجمالي</td><td>${fmt(T.n)}</td><td>${fmt(T.inv,2)}</td><td>${fmt(T.paid,2)}</td><td>${fmt(T.due,2)}</td></tr>`:''}</table>`;
}
function expCatTable(es){
  const m={};es.forEach(x=>{const k=(x.grp==='inc'?'إيراد: ':'مصروف: ')+x.cat;m[k]=m[k]||{n:0,v:0,inc:x.grp==='inc'};m[k].n++;m[k].v+=x.amount});
  return `<table><tr><th>البند</th><th>عدد الحركات</th><th>المبلغ (ج.م)</th></tr>${Object.entries(m).sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmt(v.n)}</td><td>${fmt(v.v,2)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد حركات</td></tr>'}</table>`;
}
function secBody(tab,f,print){
  const wrap=(t,h)=>print?`<h3>${t}</h3>${h}`:`<h3 class="sec">${t}</h3><div class="card" style="padding:0;overflow:auto">${h}</div>`;
  const band=a=>print?`<div class="stl" style="grid-template-columns:repeat(${a.length},1fr)">${a.map(([v,l])=>`<div><small>${l}</small><br><b>${v}</b></div>`).join('')}</div>`:`<div class="stats">${a.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
  const eL=effLoc(),all=cashEntries().filter(x=>inR(x.t,f)&&(!eL||x.loc===eL)),g=k=>all.filter(x=>x.grp===k);
  if(tab==='cust'||tab==='supp'){
    const kind=tab==='cust'?'customer':'supplier',es=g(tab),due=sumA(S.parties.filter(p=>p.kind===kind).map(p=>({d:partyStats(p.id).due})),'d');
    return band([[fmt(sumA(es,'amount'),2),tab==='cust'?'المحصَّل في الفترة (ج.م)':'المدفوع في الفترة (ج.م)'],[fmt(es.length),'عدد الحركات'],[fmt(due,2),tab==='cust'?'مستحق على العملاء حاليًا':'مستحق للموردين حاليًا']])+
      wrap(tab==='cust'?'حسابات العملاء':'حسابات الموردين',partySecTable(kind,f))+wrap(tab==='cust'?'التحصيلات حسب طريقة الدفع':'المدفوعات حسب طريقة الدفع',methodTable(es))+wrap(tab==='cust'?'سجل التحصيلات':'سجل المدفوعات',treasuryTable(es,print));
  }
  if(tab==='cus'){

const locCustOf=lid=>{const l=locs().find(x=>x.id===lid);return l&&l.party_id||null};
function custTotal(r){
  const m=S.materials.find(x=>x.id===r.material_id),q=m?matPrices(m):{sp:0,su:'ton'};
  const pr=r.cust_price!=null?+r.cust_price:(+q.sp||0),un=r.cust_unit||q.su;
  return un==='ardeb'?(r.payable||0)/ARDEB*pr:(r.payable||0)/1000*pr;
}
function partyEntries(id){
  const out=[];
  S.w.forEach(r=>{
    if(r.status!=='done')return;
    if(r.party_id===id){if(r.kind==='out'&&r.location_id&&locCustOf(r.location_id)===id)return;if(r.total)out.push({r,amt:r.total,via:false})}
    else if(r.kind==='in'&&r.location_id&&locCustOf(r.location_id)===id){const a=custTotal(r);if(a)out.push({r,amt:a,via:true})}
  });
  return out;
}
const paidSum=id=>S.pay.filter(x=>x.party_id===id).reduce((s,x)=>s+(x.amount||0),0);
function partyStats(id){const a=partyEntries(id),total=a.reduce((s,e)=>s+e.amt,0),paid=paidSum(id);return{n:a.length,kg:a.reduce((s,e)=>s+(e.r.payable||0),0),total,paid,due:total-paid}}
function ledger(id,f,t){
  const rows=[];
  partyEntries(id).forEach(e=>rows.push({t:e.r.created_at,type:'w',r:e.r,amt:e.amt,via:e.via}));
  S.pay.filter(x=>x.party_id===id).forEach(x=>rows.push({t:x.created_at,type:'p',p:x,amt:-x.amount}));
  rows.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  let bal=0;rows.forEach(x=>{bal+=x.amt;x.bal=bal});
  if(!f&&!t){rows.open=0;return rows}
  let open=0;rows.forEach(x=>{if(f&&dayKey(x.t)<f)open=x.bal});
  const out=rows.filter(x=>(!f||dayKey(x.t)>=f)&&(!t||dayKey(x.t)<=t));out.open=open;out.hasOpen=!!f;return out;
}

const linkedLocs=pid=>locs().filter(l=>l.party_id===pid).map(l=>l.id);
function qtyRows(pid,from,to,mat){
  const L=linkedLocs(pid),m={};

    if(r.status!=='done'||!r.material_id||(mat&&r.material_id!==mat))return;
    const isIn=r.kind==='in'&&L.includes(r.location_id),isOut=r.kind==='out'&&r.party_id===pid;if(!isIn&&!isOut)return;
    const d=dayKey(r.created_at);if(to&&d>to)return;
    const x=m[r.material_id]=m[r.material_id]||{name:(S.materials.find(q=>q.id===r.material_id)||{}).name||r.material_name||'',i:0,o:0,cum:0},q=r.payable||0;
    x.cum+=isIn?q:-q;if(!from||d>=from){if(isIn)x.i+=q;else x.o+=q}
  });

function qtyDaily(pid,from,to,mat){
  const L=linkedLocs(pid),ent=new Map(partyEntries(pid).map(e=>[e.r.id,e.amt])),m={};
  S.w.filter(r=>r.status==='done'&&r.material_id&&(!mat||r.material_id===mat)).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).forEach(r=>{
    const isIn=r.kind==='in'&&L.includes(r.location_id),isOut=r.kind==='out'&&r.party_id===pid;if(!isIn&&!isOut)return;
    const d=dayKey(r.created_at);if(to&&d>to)return;const q=r.payable||0;
    const x=m[r.material_id]=m[r.material_id]||{name:(S.materials.find(z=>z.id===r.material_id)||{}).name||r.material_name||'',pre:0,days:{}};
    if(from&&d<from){x.pre+=isIn?q:-q;return}
    const y=x.days[d]=x.days[d]||{d,i:0,o:0,amt:0};if(isIn)y.i+=q;else y.o+=q;y.amt+=ent.get(r.id)||0;

function qtyDailyTable(pid,from,to,mat){

  const st=[['عدد الوزنات',fmt(t.n)],['صافي بعد الخصم (كجم)',fmt(t.pay)],['إجمالي الخصومات (كجم)',fmt(t.ded)],[KL('إجمالي المشتريات (ج.م)','إجمالي المبيعات (ج.م)','إجمالي المبالغ (ج.م)'),fmt(t.total,2)],[KL('المدفوع للموردين (ج.م)','المحصَّل من العملاء (ج.م)','المدفوع / المحصَّل (ج.م)'),fmt(t.paid,2)],['المتبقي (ج.م)',fmt(t.due,2)]];
  doPrint(`<div class="copy"><h2>${esc(S.set.company)} — ${reportTitle()}</h2><div class="ctr">تقرير ${PERLBL[f.period]||'مخصص'} — الفترة: ${f.from||'البداية'} إلى ${f.to||'اليوم'} • طُبع ${dt(new Date())} • بواسطة ${esc(S.user.name)}</div>
  <div class="stl">${st.map(([k,v])=>`<div><small>${k}</small><br><b>${v}</b></div>`).join('')}</div>
  ${!f.kind?`<h3>مقارنة الشراء والبيع حسب الصنف</h3>${marginTable(a)}`:''}${extraTables(a,true)}${finTable(a,true)}</div>`,'A4');
}
function exportFinCSV(){
  const names={customer:'عميل',supplier:'مورد',none:'غير محدد'},h=['النوع','الاسم','عدد الوزنات','الصافي (كجم)','الخصومات (كجم)','بعد الخصم (كجم)','الإجمالي','المدفوع','المتبقي'];
  const rows=finGroups(repRows()).map(x=>[names[x.kind],x.name,x.n,x.net,x.ded,x.pay,x.total,x.paid,x.total-x.paid].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
  download('mizanik-financial-'+dayKey(new Date())+'.csv','﻿'+[h.join(','),...rows].join('\n'),'text/csv;charset=utf-8');
}
function exportCSV(){
  const h=['رقم الفاتورة','التاريخ','العملية','الشاحنة','السائق','العميل/المورد','الصنف','القائم','الفارغ','الصافي','خصم الفوارغ','درجة النظافة','خصم النظافة','الصافي بعد الخصم','السعر','الإجمالي','ملاحظات'];
  const rows=repRows().map(r=>[ticketNo(r),dt(r.created_at),r.kind==='in'?'وارد':'صادر',r.plate,r.driver,r.party_name,r.material_name,r.gross,r.tare,r.net,r.empties_deduction,r.grade_name,r.grade_deduction,r.payable,priceTxt(r),r.total,r.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
  download('mizanik-'+dayKey(new Date())+'.csv','\uFEFF'+[h.join(','),...rows].join('\n'),'text/csv;charset=utf-8');
}

/* ====== المزيد: الإعدادات ====== */
function vMore(){
  if(!S.sd)S.sd={company:S.set.company,empty_unit_kg:S.set.empty_unit_kg||'',grades:S.set.grades.map(g=>({...g}))};
  const sd=S.sd,adm=can.admin(),cams=camList();
  return `<div class="card"><b>الحساب</b><div class="urow"><span>${esc(S.user.name)} — ${ROLES[S.user.role]}</span><button class="btn2" onclick="logout()">خروج</button></div>
    <div class="urow"><span class="mute">وضع التشغيل: ${S.mode==='cloud'?'أونلاين':'محلي'}</span><button class="btn2" onclick="if(confirm('تغيير وضع التشغيل؟')){logout().then(()=>resetMode())}">تغيير</button></div></div>
  ${locCard()}
  ${scaleCard()}
  ${adm?`<div class="card"><b>بيانات المنشأة والخصومات</b>
    <label>اسم المنشأة (يظهر في التذكرة)</label><input id="s-co" value="${esc(sd.company)}">
    <label>وزن الفارغة الواحدة الافتراضي (كجم)</label><input id="s-eu" type="number" inputmode="decimal" value="${esc(sd.empty_unit_kg)}">
    <label>درجات النظافة ونسبة الخصم %</label>
    ${sd.grades.map((g,i)=>`<div class="row" style="grid-template-columns:2fr 1fr auto;margin-bottom:8px"><input id="g-n${i}" value="${esc(g.name)}"><input id="g-p${i}" type="number" inputmode="decimal" value="${esc(g.pct)}"><button class="btn2 bad" onclick="gDel(${i})">✕</button></div>`).join('')}
    <button class="btn2" onclick="gAdd()">درجة جديدة</button><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div>`:''}
  <div class="card"><b>الكاميرات (على هذا الجهاز)</b>
    ${cams.map(c=>`<div class="urow"><label style="margin:0;display:flex;gap:8px;align-items:center;flex:1"><input type="checkbox" style="width:auto" ${c.on?'checked':''} onchange="camToggle('${c.id}',this.checked)"> ${esc(c.name)} <span class="mute">(${c.type==='ip'?'IP':'جهاز'})</span></label><span><button class="btn2" onclick="testCam('${c.id}')">اختبار</button> <button class="btn2 bad" onclick="camDel('${c.id}')">✕</button></span></div>`).join('')||'<div class="mute" style="padding:8px 0">لا توجد كاميرات</div>'}
    <div class="acts"><button class="btn2" onclick="detectCams()">اكتشاف كاميرات الجهاز / USB</button><button class="btn2" onclick="ipCamForm()">كاميرا مراقبة IP</button><button class="btn2" onclick="testAllCams()">اختبار الكل</button></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--text);margin-top:12px"><input type="checkbox" ${autoOn()?'checked':''} onchange="localStorage.setItem('mz_autocam',this.checked?'1':'0')"> التقاط تلقائي من كل الكاميرات المفعّلة عند حفظ كل وزنة</label></div>
  ${adm?`<div class="card"><b>المستخدمون</b>${S.users.map(u=>S.mode==='cloud'?
    `<div class="urow"><span>${esc(u.name||u.id)}</span><select style="width:auto" onchange="setRole('${u.id}',this.value)" ${u.id===S.user.id?'disabled':''}>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></div>`:
    `<div class="urow"><span>${esc(u.name)} <span class="mute">(${ROLES[u.role]})</span></span><button class="btn2" onclick="userForm('${u.id}')"></button></div>`).join('')}
    ${S.mode==='local'?'<button class="btn2" style="margin-top:10px" onclick="userForm()">مستخدم جديد</button>':'<p class="mute" style="font-size:12px">المستخدم الجديد يسجّل بنفسه من شاشة "إنشاء حساب" ثم تحدد صلاحيته من هنا.</p>'}</div>
  <div class="card"><b>المراجعة</b><div class="acts"><button class="btn2" onclick="openAudit()">سجل التدقيق</button></div></div>
  <div class="card"><b>نسخة احتياطية</b><div class="acts"><button class="btn2" onclick="backup()">تنزيل نسخة</button><button class="btn2" onclick="$('rest').click()">استرجاع</button><input type="file" id="rest" accept=".json" hidden onchange="restore(event)"></div></div>`:''}`;
}
function syncSet(){
  if(!$('s-co'))return;const sd=S.sd;sd.company=$('s-co').value;sd.empty_unit_kg=$('s-eu').value;
  sd.grades=sd.grades.map((g,i)=>({name:$('g-n'+i).value,pct:$('g-p'+i).value}));
}
function gAdd(){syncSet();S.sd.grades.push({name:'',pct:0});render()}
function gDel(i){syncSet();S.sd.grades.splice(i,1);render()}
async function saveSettings(){
  syncSet();const sd=S.sd,grades=sd.grades.filter(g=>g.name.trim()).map(g=>({name:g.name.trim(),pct:num(g.pct)}));
  const r={...S.set,id:'main',company:sd.company.trim()||'ميزانك',empty_unit_kg:num(sd.empty_unit_kg),grades,created_at:S.set.created_at||new Date().toISOString()};
  try{await DB.put('settings',r);audit('update','settings','إعدادات المنشأة',diffTxt(S.set,r,[['company','اسم المنشأة'],['empty_unit_kg','وزن الفارغة']]));S.set=r;S.sd=null;$('hname').textContent=r.company;render();toast('✅ تم الحفظ')}catch(e){toast('❌ '+e.message,1)}
}
function camToggle(id,on){const a=camList();a.find(c=>c.id===id).on=on;camSave(a)}
function camDel(id){camSave(camList().filter(c=>c.id!==id));render()}
async function detectCams(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());
    const dv=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cur=camList();
    dv.forEach((d,i)=>{if(!cur.find(c=>c.deviceId===d.deviceId))cur.push({id:uid(),name:d.label||'كاميرا '+(i+1),type:'device',deviceId:d.deviceId,on:true})});
    camSave(cur);render();toast('تم اكتشاف '+dv.length+' كاميرا');
  }catch(e){toast('❌ لا توجد صلاحية للكاميرا (لازم HTTPS أو localhost)',1)}
}
function ipCamForm(){
  modal(`<h2>إضافة كاميرا مراقبة IP</h2><p class="mute" style="font-size:13px">رابط صورة لحظية (Snapshot JPG) أو بث MJPEG. لازم الكاميرا تسمح بـ CORS، وإلا استخدم كاميرا USB/الجهاز.</p>
  <label>الاسم</label><input id="ic-n" placeholder="كاميرا البوابة"><label>الرابط</label><input id="ic-u" dir="ltr" placeholder="http://192.168.1.50/snapshot.jpg">
  <div class="acts"><button class="btn" onclick="ipCamSave()">حفظ</button><button class="btn2" onclick="closeModal()">إلغاء</button></div>`);
}
function ipCamSave(){const n=$('ic-n').value.trim(),u=$('ic-u').value.trim();if(!n||!u)return;const a=camList();a.push({id:uid(),name:n,type:'ip',url:u,on:true});camSave(a);closeModal();render()}
async function setRole(id,role){const u=S.users.find(x=>x.id===id);const old=u.role;u.role=role;try{await DB.put('profiles',u);toast('✅ تم')}catch(e){u.role=old;toast('❌ '+e.message,1);render()}}
function userForm(id){
  const u=S.users.find(x=>x.id===id)||{name:'',role:'operator'};
  modal(`<h2>${id?'تعديل':'إضافة'} مستخدم</h2><label>الاسم</label><input id="un" value="${esc(u.name)}"><label>الرقم السري ${id?'(اتركه فاضي لعدم التغيير)':''}</label><input id="up" type="password" inputmode="numeric">
  <label>الصلاحية</label><select id="ur">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select>
  <div class="acts"><button class="btn" onclick="saveUser('${id||''}')">حفظ</button>${id&&id!==S.user.id?`<button class="btn2 bad" onclick="delUser('${id}')">حذف</button>`:''}<button class="btn2" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveUser(id){
  const name=$('un').value.trim(),pin=$('up').value,old=S.users.find(x=>x.id===id);
  if(!name)return toast('⚠️ اكتب الاسم',1);if(!old&&pin.length<4)return toast('⚠️ الرقم السري 4 أرقام على الأقل',1);
  if(old&&old.id===S.user.id&&$('ur').value!=='admin'&&S.users.filter(x=>x.role==='admin').length<2)return toast('⚠️ لازم يفضل مدير واحد على الأقل',1);
  const r={...(old||{id:uid(),created_at:new Date().toISOString()}),name,role:$('ur').value};
  if(pin)r.pin_hash=await sha(pin);
  try{await DB.put('users',r);const i=S.users.findIndex(x=>x.id===r.id);if(i>=0)S.users[i]=r;else S.users.push(r);if(r.id===S.user.id){S.user.name=r.name;S.user.role=r.role}closeModal();render();toast('✅ تم الحفظ')}catch(e){toast('❌ '+e.message,1)}
}
async function delUser(id){if(!confirm('حذف المستخدم؟'))return;await DB.del('users',id);S.users=S.users.filter(x=>x.id!==id);closeModal();render()}
async function backup(){
  const o={};for(const t of ['parties','materials','weighings','settings','payments','expenses','custody'])o[t]=await DB.all(t);if(S.mode==='local')o.users=await DB.all('users');
  download('mizanik-backup-'+dayKey(new Date())+'.json',JSON.stringify(o),'application/json');
}
async function restore(e){
  const f=e.target.files[0];if(!f)return;if(!confirm('الاسترجاع بيضيف/يستبدل السجلات الموجودة بنفس الرقم. متابعة؟'))return;
  try{const o=JSON.parse(await f.text());for(const t of ['parties','materials','weighings','settings','payments','expenses','custody','users']){if(t==='users'&&S.mode!=='local')continue;for(const r of o[t]||[])await DB.put(t,r)}await loadData();render();toast('✅ تم الاسترجاع')}catch(err){toast('❌ ملف غير صالح',1)}
  e.target.value='';
}

boot();
</script>
